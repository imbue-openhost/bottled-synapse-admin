[app]
name = "synapse-admin"
version = "0.11.4"
description = "Admin UI for Matrix Synapse homeservers (Awesome-Technologies/synapse-admin)"

[runtime.container]
image = "Dockerfile"
port = 8080

[routing]
health_check = "/healthz"
# No public_paths: the app is login-gated by the OpenHost router. Synapse-admin
# additionally requires Matrix admin credentials for the target homeserver.

[resources]
memory_mb = 256
cpu_cores = 0.1

[data]
# Holds session.json: the homeserver URL and the Matrix access token obtained at
# login, so the session is shared across browsers instead of living in localStorage.
app_data = true
